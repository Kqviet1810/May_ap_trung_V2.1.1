name = "mayap-push-worker"
main = "src/index.js"
compatibility_date = "2026-08-01"
# Bat buoc: thu vien gui Web Push (@block65/webcrypto-web-push) tham chieu
# node:crypto lam fallback - thieu co nay Worker co the loi luc gui push that.
compatibility_flags = ["nodejs_compat"]

# Bien KHONG bi mat (khong nhay cam) - xem README de biet cach dat cac secret
# (VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, DEVICE_KEY_PEPPER)
# bang `wrangler secret put`, KHONG dat o day.
[vars]
# Doi thanh dung origin cua trang GitHub Pages, vi du:
# "https://ten-user.github.io"  (khong co dau / o cuoi)
ALLOWED_ORIGIN = "https://kqviet1810.github.io"

[[d1_databases]]
binding = "DB"
database_name = "mayap_push"
database_id = "e92a393c-8596-4254-b274-68e57a6de290"
