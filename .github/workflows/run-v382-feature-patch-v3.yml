name: Run corrected v3.8.2 feature patch

on:
  push:
    branches:
      - hardening/v3.8.2-humidity
    paths:
      - .github/workflows/run-v382-feature-patch-v3.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Execute corrected source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/patch-v382-features.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("\n          PY\n", start)
          script = textwrap.dedent(wf[start:end])

          old1 = "c.sirenSelfTestEnabled = p.sirenSelfTestEnabled != 0U;\\n  return c;"
          new1 = "c.sirenSelfTestEnabled = p.sirenSelfTestEnabled != 0U;\\n  sanitizeMachineConfig(c);\\n  return c;"
          old2 = "c.ventScheduleHour6 = p.ventScheduleHour6;\\n  return c;"
          new2 = "c.ventScheduleHour6 = p.ventScheduleHour6;\\n  sanitizeMachineConfig(c);\\n  return c;"
          if script.count(old1) != 1 or script.count(old2) != 1:
              raise SystemExit(f'unpack patch fragments unexpected: {script.count(old1)}, {script.count(old2)}')
          script = script.replace(old1, new1, 1).replace(old2, new2, 1)
          exec(compile(script, '<v382-feature-patch>', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
          node --check app.js
          python3 tools/check_release_sync.py
          python3 tools/check_v381_reliability.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'Kiều Việt'
          git config user.email '120502812+Kqviet1810@users.noreply.github.com'
          git add MAYAP_INDUSTRIAL_v3_4_0/config.h \
                  MAYAP_INDUSTRIAL_v3_4_0/machine_control.h \
                  MAYAP_INDUSTRIAL_v3_4_0/hmi.h \
                  MAYAP_INDUSTRIAL_v3_4_0/realtime_link.h \
                  index.html app.js sw.js release-manifest.json \
                  tools/check_v381_reliability.py
          git commit -m 'feat: gate humidifier hardware and add scheduled ventilation'
          git push origin HEAD:hardening/v3.8.2-humidity
