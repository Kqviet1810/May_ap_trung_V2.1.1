name: Fix v3.8.2 patch script

on:
  push:
    branches:
      - hardening/v3.8.2-humidity
    paths:
      - .github/workflows/fix-v382-patch-script.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix unpack pattern
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patch-v382-features.yml')
          s = p.read_text(encoding='utf-8')
          old = """          '''  c.sirenSelfTestEnabled = p.sirenSelfTestEnabled != 0U;\\n  return c;''',
          '''  c.sirenSelfTestEnabled = p.sirenSelfTestEnabled != 0U;\\n  c.ventScheduleEnabled = p.ventScheduleEnabled != 0U;\\n  c.ventScheduleCount = p.ventScheduleCount;\\n  c.ventScheduleDurationMin = p.ventScheduleDurationMin;\\n  c.ventScheduleHour1 = p.ventScheduleHour1;\\n  c.ventScheduleHour2 = p.ventScheduleHour2;\\n  c.ventScheduleHour3 = p.ventScheduleHour3;\\n  c.ventScheduleHour4 = p.ventScheduleHour4;\\n  c.ventScheduleHour5 = p.ventScheduleHour5;\\n  c.ventScheduleHour6 = p.ventScheduleHour6;\\n  return c;''')"""
          new = """          '''  c.sirenSelfTestEnabled = p.sirenSelfTestEnabled != 0U;\\n  sanitizeMachineConfig(c);\\n  return c;''',
          '''  c.sirenSelfTestEnabled = p.sirenSelfTestEnabled != 0U;\\n  c.ventScheduleEnabled = p.ventScheduleEnabled != 0U;\\n  c.ventScheduleCount = p.ventScheduleCount;\\n  c.ventScheduleDurationMin = p.ventScheduleDurationMin;\\n  c.ventScheduleHour1 = p.ventScheduleHour1;\\n  c.ventScheduleHour2 = p.ventScheduleHour2;\\n  c.ventScheduleHour3 = p.ventScheduleHour3;\\n  c.ventScheduleHour4 = p.ventScheduleHour4;\\n  c.ventScheduleHour5 = p.ventScheduleHour5;\\n  c.ventScheduleHour6 = p.ventScheduleHour6;\\n  sanitizeMachineConfig(c);\\n  return c;''')"""
          if s.count(old) != 1:
              raise SystemExit(f'pattern count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit script fix
        shell: bash
        run: |
          git config user.name 'Kiều Việt'
          git config user.email '120502812+Kqviet1810@users.noreply.github.com'
          git add .github/workflows/patch-v382-features.yml
          git commit -m 'fix: correct v3.8.2 patch script pattern'
          git push origin HEAD:hardening/v3.8.2-humidity
