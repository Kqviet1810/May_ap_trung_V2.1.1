name: Apply v3.8.2 telemetry history feature v3

on:
  push:
    branches:
      - hardening/v3.8.2-humidity
    paths:
      - .github/workflows/run-v382-telemetry-patch-v3.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, gzip
          src = Path('.github/workflows/run-v382-telemetry-patch-v2.yml').read_text(encoding='utf-8')
          m = re.search(r"printf '%s' '([A-Za-z0-9+/=]+)'", src)
          if not m:
              raise SystemExit('telemetry payload not found')
          Path('/tmp/patch_telemetry.py').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          PY
          python3 /tmp/patch_telemetry.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ('cloudflare/schema.sql', 'styles.css'):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          # GitHub Actions GITHUB_TOKEN cannot update workflow files. Keep the
          # feature commit source-only; permanent CI hooks are applied separately
          # through the GitHub connector after this validated commit lands.
          git checkout -- .github/workflows/reliability-checks.yml .github/workflows/build-firmware.yml
      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check app.js
          node --check sw.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/db.js
          python3 tools/check_release_sync.py
          python3 tools/check_v381_reliability.py
          python3 tools/check_telemetry_history.py
          test "$(grep -o 'id=\"batchLogList\"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"temperatureChartCanvas\"' index.html | wc -l)" -eq 1
          if git diff --name-only | grep -qx 'MAYAP_INDUSTRIAL_v3_4_0/realtime_link.h'; then
            echo '::error::Telemetry feature must not modify MQTT realtime_link.h'
            exit 1
          fi
      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kiều Việt'
          git config user.email '120502812+Kqviet1810@users.noreply.github.com'
          git add MAYAP_INDUSTRIAL_v3_4_0/cloud_alert_link.h \
                  cloudflare/schema.sql cloudflare/migrations/0003_telemetry_history.sql \
                  cloudflare/src/db.js cloudflare/src/index.js \
                  index.html app.js styles.css sw.js release-manifest.json \
                  tools/check_telemetry_history.py
          git commit -m 'feat: add 30-minute temperature history chart'
          git push origin HEAD:hardening/v3.8.2-humidity
