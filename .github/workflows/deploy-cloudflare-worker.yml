name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Nhanh/tag chua ma Worker can deploy'
        required: true
        default: 'hardening/v3.8.0'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ma nguon can deploy
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kiem tra secret trien khai
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Thieu CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Thieu CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Kiem tra JavaScript Worker
        run: |
          node --check cloudflare/src/index.js
          node --check cloudflare/src/auth.js
          node --check cloudflare/src/db.js
          node --check cloudflare/src/push.js

      - name: Cai phu thuoc
        working-directory: cloudflare
        run: npm install --ignore-scripts

      - name: Cap nhat D1 schema
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply mayap_push --remote

      - name: Trien khai Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
