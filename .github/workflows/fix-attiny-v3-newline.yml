name: One-shot fix ATtiny v3 generated newline

on:
  push:
    branches:
      - hardening/v3.8.1-attiny-activity-alarm
    paths:
      - '.github/attiny-v3-newline-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/v3.8.1-attiny-activity-alarm
      - name: Fix generated C++ string and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MAYAP_INDUSTRIAL_v3_4_0/machine_control.h')
          s = p.read_text(encoding='utf-8')
          bad = 'tinySiren=%u 9v=%s\n",'
          good = 'tinySiren=%u 9v=%s\\n",'
          if s.count(bad) != 1:
              raise SystemExit(f'expected one generated-newline defect, found {s.count(bad)}')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')
          PY
          python3 tools/check_v381_reliability.py
          grep -n 'tinySiren=%u 9v=%s\\n' MAYAP_INDUSTRIAL_v3_4_0/machine_control.h
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAYAP_INDUSTRIAL_v3_4_0/machine_control.h
          git commit -m "fix(attiny): preserve escaped diagnostic newline"
          git push origin HEAD:hardening/v3.8.1-attiny-activity-alarm
