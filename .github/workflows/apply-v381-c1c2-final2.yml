name: Apply v3.8.1 C1-C2 remediation final2

on:
  push:
    branches:
      - hardening/v3.8.1-reliability

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: hardening/v3.8.1-reliability
          fetch-depth: 2

      - name: Normalize patch and pre-apply High Temp descriptor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patch = Path('tools/apply_v381_c1c2_fixes.py')
          s = patch.read_text(encoding='utf-8')
          old = "t = exact(t, '  SirenBatteryLow = 502,\\n', '', \"remove E502 enum\")"
          new = "t = rex(t, r'^\\s*SirenBatteryLow = 502,.*?\\n', '', \"remove E502 enum\", flags=re.MULTILINE)"
          if s.count(old) == 1:
              s = s.replace(old, new)

          lines = s.splitlines(keepends=True)
          starts = [i for i, line in enumerate(lines) if "t = exact(t, '  // Nhiet cao: cam SSR" in line]
          if len(starts) != 1:
              raise SystemExit(f'High Temp matcher start count={len(starts)}')
          start = starts[0]
          end = None
          for i in range(start, min(start + 12, len(lines))):
              if '"High Temp D14")' in lines[i]:
                  end = i
                  break
          if end is None:
              raise SystemExit('High Temp matcher end not found')
          del lines[start:end + 1]
          patch.write_text(''.join(lines), encoding='utf-8')

          mc = Path('MAYAP_INDUSTRIAL_v3_4_0/machine_control.h')
          m = mc.read_text(encoding='utf-8')
          old_desc = '{FaultCode::HighTemperature, FaultSeverity::Stop, 240U, AlarmTempHigh, false, true, true, true, true, true, "TEMP HIGH"}'
          new_desc = '{FaultCode::HighTemperature, FaultSeverity::Stop, 240U, AlarmTempHigh, false, true, false, true, true, true, "TEMP HIGH"}'
          if m.count(old_desc) != 1:
              raise SystemExit(f'High Temp descriptor expected once, got {m.count(old_desc)}')
          m = m.replace(old_desc, new_desc, 1)
          old_comment = '// Nhiet cao: cam SSR, nha contactor tong, bat ca hai quat.'
          if m.count(old_comment) != 1:
              raise SystemExit(f'High Temp comment expected once, got {m.count(old_comment)}')
          m = m.replace(old_comment, '// Nhiet cao: cam SSR + bat hai quat, GIU D14/contactor ON; Emergency/master-drop moi nha D14.', 1)
          mc.write_text(m, encoding='utf-8')
          PY

      - name: Apply all remaining guarded fixes
        run: python3 tools/apply_v381_c1c2_fixes.py

      - name: Validate permanent gates
        run: |
          node --check app.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/security-wrapper.js
          node --check cloudflare/src/reliability-wrapper.js
          python3 tools/check_release_sync.py
          python3 tools/check_v381_reliability.py
          git diff --check

      - name: Remove temporary patch machinery
        run: |
          git rm -f tools/apply_v381_c1c2_fixes.py
          git rm -f .github/workflows/apply-v381-c1c2-once.yml
          git rm -f .github/workflows/apply-v381-c1c2-retry.yml
          git rm -f .github/workflows/apply-v381-c1c2-final.yml
          git rm -f .github/workflows/apply-v381-c1c2-final2.yml

      - name: Commit verified remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::Patch produced no changes"; exit 1; }
          git commit -m "fix(v3.8.1): resolve C1/C2 safety and lifecycle findings"
          git push origin HEAD:hardening/v3.8.1-reliability
