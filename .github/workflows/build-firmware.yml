name: Build & release firmware

# Tu dong bien dich MAYAP_INDUSTRIAL_v3_4_0.ino thanh file .bin bang
# arduino-cli tren may chu GitHub (co internet day du, khac han moi may local
# dung de phat trien) - khong ai phai tu tay bien dich + upload file .bin
# nua. Chi can day 1 tag dang "vX.Y.Z" (khop MAYAP_FIRMWARE_VERSION trong
# config.h) len GitHub la workflow nay tu bien dich + tao GitHub Release +
# dinh kem file .bin vao do. Cloudflare Worker (xem cloudflare/src/index.js:
# handleFirmwareCheck/handleFirmwareDownload) doc phien ban/tai file firmware
# THANG tu GitHub Releases API - khong can trang admin upload thu cong.
#
# Cach phat hanh 1 ban moi:
#   git tag v3.5.0
#   git push origin v3.5.0
#
# QUAN TRONG - cau hinh board (FQBN) da SUA LAI sau su co thuc te: dat
# FlashSize=8M (suy tu ten module "...-N8", quy uoc Espressif = 8MB) tung
# gay may KHONG BOOT DUOC that ("boot: Failed to verify partition table" /
# "exceeds flash chip size 0x400000") vi CHIP THAT tren board nay chi co
# 4MB flash - ten module ghi "N8" gay nham, KHONG dung voi phan cung that.
#   - Board hien trong Arduino IDE: "ESP32S3 Dev Module" -> esp32:esp32:esp32s3
#   - Flash THAT: 4MB -> FlashSize=4M (KHONG duoc doi lai 8M neu chua tu
#     kiem chung lai dung luong chip that qua log boot)
#   - Partition Scheme phai nam gon trong 4MB, van can 2 khe OTA (dual-slot,
#     an toan hon huge_app single-slot) -> PartitionScheme=min_spiffs
#     ("Minimal SPIFFS (1.9MB APP with OTA/190KB SPIFFS)" - 1.9MB/khe, du
#     cho firmware hien tai ~1.3MB)
#   - Khong PSRAM -> PSRAM=disabled
# Neu lan chay dau tien (xem buoc "Bao cao kich thuoc") ra kich thuoc CHENH
# LECH RO RET so voi kich thuoc Arduino IDE bao luc Upload tren may ban, sua
# lai gia tri FQBN ben duoi cho khop truoc khi dung cho ban phat hanh that -
# TUYET DOI khong doi FlashSize len lai 8M khi chua xac nhan chip that.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

env:
  MAYAP_FQBN: esp32:esp32:esp32s3:PartitionScheme=min_spiffs,FlashSize=4M,PSRAM=disabled

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v4

      - name: Cai dat arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cai loi ESP32 (Espressif)
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Cai thu vien (U8g2, PubSubClient, ArduinoJson)
        run: arduino-cli lib install U8g2 PubSubClient ArduinoJson

      - name: Bien dich firmware
        run: |
          arduino-cli compile \
            --fqbn "${{ env.MAYAP_FQBN }}" \
            --output-dir ./build \
            --verbose \
            MAYAP_INDUSTRIAL_v3_4_0

      - name: Bao cao kich thuoc (doi chieu voi log Arduino IDE tren may ban)
        run: ls -la ./build/*.bin

      - name: Doi ten file .bin theo tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp ./build/MAYAP_INDUSTRIAL_v3_4_0.ino.bin "./MAYAP-firmware-${VERSION}.bin"

      # Chay tay (workflow_dispatch, khong co tag) chi de kiem tra bien dich
      # con chay duoc khong - luu ket qua thanh artifact tai ve xem thu,
      # KHONG tao Release/tag nao ca.
      - name: Luu file .bin de kiem tra (chi khi chay tay)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin-test
          path: ./build/MAYAP_INDUSTRIAL_v3_4_0.ino.bin
          retention-days: 7

      - name: Tao GitHub Release + dinh kem file .bin
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./MAYAP-firmware-*.bin
          generate_release_notes: true
