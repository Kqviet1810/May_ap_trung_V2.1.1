name: Build & release firmware

on:
  push:
    branches:
      - 'hardening/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  MAYAP_FQBN: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,PartitionScheme=default_8MB,FlashSize=8M,PSRAM=disabled

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ap dung online hardening mot lan
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if [ ! -f .github/workflows/online-command-auth-once.yml ]; then
            echo "Khong co patch tam - bo qua"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/online-command-auth-once.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(body) + '\n'
          code = code.replace('if count != 1:', 'if count < 1:')

          ns = {}
          try:
              exec(compile(code, str(path), 'exec'), ns)
          except SystemExit as exc:
              if 'realtime_link.h' not in str(exc):
                  raise
              rt_path = Path('MAYAP_INDUSTRIAL_v3_4_0/realtime_link.h')
              rt = rt_path.read_text(encoding='utf-8')
              if '#include <mbedtls/md.h>' not in rt:
                  rt = rt.replace('#include <esp_wifi.h>\n', '#include <esp_wifi.h>\n#include <mbedtls/md.h>\n', 1)

              if 'mqttVerifySignedWrite' not in rt:
                  trust_new = ns.get('trust_new')
                  if not trust_new:
                      raise SystemExit('Khong tim thay trust_new trong patch tam')
                  trust_re = re.compile(
                      r'inline bool mqttCommandChannelTrusted\(\) \{.*?\n\}\n\n(?=inline void handleCommandMessage)',
                      re.S,
                  )
                  rt, n = trust_re.subn(trust_new + '\n', rt, count=1)
                  if n != 1:
                      raise SystemExit(f'realtime_link.h: khong thay mqttCommandChannelTrusted ({n})')

              if 'JsonDocument wireDoc;' not in rt:
                  new_callback = ns.get('new_callback')
                  if not new_callback:
                      raise SystemExit('Khong tim thay new_callback trong patch tam')
                  callback_re = re.compile(
                      r'inline void mqttMessageCallback\(char \*topic, uint8_t \*payload,\n'
                      r'\s*unsigned int length\) \{.*?\n\}\n\n'
                      r'(?=// ------------------------------ Vong doi ket noi)',
                      re.S,
                  )
                  rt, n = callback_re.subn(new_callback + '\n', rt, count=1)
                  if n != 1:
                      raise SystemExit(f'realtime_link.h: khong thay mqttMessageCallback ({n})')
              rt_path.write_text(rt, encoding='utf-8')

              wrangler = Path('cloudflare/wrangler.toml')
              wt = wrangler.read_text(encoding='utf-8')
              if 'MAYAP_MQTT_PASSWORD' not in wt:
                  wt = wt.replace(
                      '# (VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, DEVICE_KEY_PEPPER,\n# GITHUB_TOKEN tuy chon cho tinh nang cap nhat firmware) bang\n',
                      '# (VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, DEVICE_KEY_PEPPER,\n# MAYAP_MQTT_PASSWORD, GITHUB_TOKEN tuy chon cho tinh nang cap nhat firmware) bang\n',
                      1,
                  )
                  wrangler.write_text(wt, encoding='utf-8')

          print('online command authentication patch completed')
          PY
          node --check app.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/db.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js cloudflare/src/index.js cloudflare/wrangler.toml \
            MAYAP_INDUSTRIAL_v3_4_0/device_identity.h \
            MAYAP_INDUSTRIAL_v3_4_0/cloud_alert_link.h \
            MAYAP_INDUSTRIAL_v3_4_0/realtime_link.h
          git commit -m "security(online): authenticate MQTT writes per device"
          git push origin HEAD:hardening/v3.8.0

      - name: Cai dat arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cai loi ESP32
        run: |
          for attempt in 1 2 3; do
            arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json && break
            test "$attempt" = 3 && exit 1
            sleep 5
          done
          for attempt in 1 2 3; do
            arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json && break
            test "$attempt" = 3 && exit 1
            sleep 5
          done

      - name: Cai thu vien
        run: |
          for attempt in 1 2 3; do
            arduino-cli lib install U8g2@2.36.19 PubSubClient@2.8.0 ArduinoJson@7.4.3 && break
            test "$attempt" = 3 && exit 1
            sleep 5
          done

      - name: Kiem tra version va ma nguon an toan
        run: |
          VERSION=$(sed -n 's/.*MAYAP_FIRMWARE_VERSION\[\].*"\([^"]*\)".*/\1/p' MAYAP_INDUSTRIAL_v3_4_0/config.h)
          test -n "$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME khong khop firmware $VERSION"
            exit 1
          fi
          if grep -R "setInsecure()" MAYAP_INDUSTRIAL_v3_4_0 --include='*.h' --include='*.ino'; then
            echo "::error::Khong duoc bo qua xac thuc TLS"
            exit 1
          fi
          if grep -R "BEGIN.*PRIVATE KEY" MAYAP_INDUSTRIAL_v3_4_0 --include='*.h' --include='*.ino'; then
            echo "::error::Private key khong duoc nam trong firmware"
            exit 1
          fi

      - name: Tao MQTT secret cho build deploy
        if: github.event_name != 'pull_request'
        env:
          MAYAP_MQTT_USERNAME: ${{ secrets.MAYAP_MQTT_USERNAME }}
          MAYAP_MQTT_PASSWORD: ${{ secrets.MAYAP_MQTT_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          username = os.getenv("MAYAP_MQTT_USERNAME", "")
          password = os.getenv("MAYAP_MQTT_PASSWORD", "")
          if not username or not password:
              raise SystemExit("Thieu GitHub Secrets: MAYAP_MQTT_USERNAME/MAYAP_MQTT_PASSWORD")

          Path("MAYAP_INDUSTRIAL_v3_4_0/build_secrets.h").write_text(
              "#pragma once\n"
              + "#define MAYAP_MQTT_USERNAME " + json.dumps(username) + "\n"
              + "#define MAYAP_MQTT_PASSWORD " + json.dumps(password) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Kiem tra JavaScript
        run: |
          node --check app.js
          node --check push.js
          node --check sw.js
          node --check config.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/auth.js
          node --check cloudflare/src/db.js
          node --check cloudflare/src/push.js

      - name: Bien dich firmware
        run: |
          arduino-cli compile \
            --fqbn "${{ env.MAYAP_FQBN }}" \
            --output-dir ./build \
            --verbose \
            MAYAP_INDUSTRIAL_v3_4_0

      - name: Bao cao kich thuoc
        run: ls -la ./build/*.bin

      - name: Luu file .bin pilot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin-pilot
          path: ./build/MAYAP_INDUSTRIAL_v3_4_0.ino.bin
          retention-days: 7

      - name: Doi ten file .bin theo tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp ./build/MAYAP_INDUSTRIAL_v3_4_0.ino.bin "./MAYAP-firmware-${GITHUB_REF_NAME#v}.bin"

      - name: Ky so firmware
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.MAYAP_OTA_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$OTA_SIGNING_PRIVATE_KEY" || { echo "::error::Thieu khoa ky OTA"; exit 1; }
          printf '%s\n' "$OTA_SIGNING_PRIVATE_KEY" > ota-signing-key.pem
          openssl dgst -sha256 -sign ota-signing-key.pem -out firmware.sig.der "./MAYAP-firmware-${GITHUB_REF_NAME#v}.bin"
          base64 -w0 firmware.sig.der > "./MAYAP-firmware-${GITHUB_REF_NAME#v}.sig"
          rm -f ota-signing-key.pem firmware.sig.der

      - name: Tao GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./MAYAP-firmware-*.bin
            ./MAYAP-firmware-*.sig
          generate_release_notes: true
