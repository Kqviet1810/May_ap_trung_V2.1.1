name: Build & release firmware

on:
  push:
    branches:
      - 'hardening/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  MAYAP_FQBN: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,PartitionScheme=default_8MB,FlashSize=8M,PSRAM=disabled

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ap dung offline hardening (mot lan)
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore: execute offline hardening via build' }}"
        run: python3 tools/apply_offline_hardening_v2.py

      - name: Cai dat arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cai toolchain ATtiny13A
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr

      - name: Cai loi ESP32
        run: |
          for attempt in 1 2 3; do
            arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json && break
            test "$attempt" = 3 && exit 1
            sleep 5
          done
          for attempt in 1 2 3; do
            arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json && break
            test "$attempt" = 3 && exit 1
            sleep 5
          done

      - name: Cai thu vien
        run: |
          for attempt in 1 2 3; do
            arduino-cli lib install U8g2@2.36.19 PubSubClient@2.8.0 ArduinoJson@7.4.3 && break
            test "$attempt" = 3 && exit 1
            sleep 5
          done

      - name: Kiem tra version va ma nguon an toan
        run: |
          VERSION=$(sed -n 's/.*MAYAP_FIRMWARE_VERSION\[\].*"\([^"]*\)".*/\1/p' MAYAP_INDUSTRIAL_v3_4_0/config.h)
          test -n "$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME khong khop firmware $VERSION"
            exit 1
          fi
          if grep -R "setInsecure()" MAYAP_INDUSTRIAL_v3_4_0 --include='*.h' --include='*.ino'; then
            echo "::error::Khong duoc bo qua xac thuc TLS"
            exit 1
          fi
          if grep -R "BEGIN.*PRIVATE KEY" MAYAP_INDUSTRIAL_v3_4_0 --include='*.h' --include='*.ino'; then
            echo "::error::Private key khong duoc nam trong firmware"
            exit 1
          fi

      - name: Kiem tra hop dong protocol ESP32 ATtiny
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cfg = Path('MAYAP_INDUSTRIAL_v3_4_0/config.h').read_text(encoding='utf-8')
          tiny = Path('ATTINY13A_POWER_ALARM/ATTINY13A_POWER_ALARM.ino').read_text(encoding='utf-8')

          def number(text, pattern, label):
              m = re.search(pattern, text)
              if not m:
                  raise SystemExit(f'Thieu {label}')
              return int(m.group(1))

          esp_proto = number(cfg, r'ATTINY_PROTOCOL_VERSION\s*=\s*(\d+)U', 'ATTINY_PROTOCOL_VERSION')
          tiny_proto = number(tiny, r'PROTOCOL_VERSION\s*=\s*(\d+)U', 'PROTOCOL_VERSION')
          if esp_proto != tiny_proto:
              raise SystemExit(f'Protocol mismatch ESP={esp_proto} Tiny={tiny_proto}')

          pairs = [
              ('BATCH_START', r'ATTINY_MSG_BATCH_START\s*=\s*(\d+)U', r'MSG_BATCH_START\s*=\s*(\d+)U'),
              ('BATCH_END', r'ATTINY_MSG_BATCH_END\s*=\s*(\d+)U', r'MSG_BATCH_END\s*=\s*(\d+)U'),
              ('SIREN_ON', r'ATTINY_MSG_SIREN_ON\s*=\s*(\d+)U', r'MSG_SIREN_ON\s*=\s*(\d+)U'),
              ('SIREN_OFF', r'ATTINY_MSG_SIREN_OFF\s*=\s*(\d+)U', r'MSG_SIREN_OFF\s*=\s*(\d+)U'),
              ('STATUS_QUERY', r'ATTINY_MSG_STATUS_QUERY\s*=\s*(\d+)U', r'MSG_STATUS_QUERY\s*=\s*(\d+)U'),
              ('STATUS_BASE', r'ATTINY_MSG_STATUS_BASE\s*=\s*(\d+)U', r'MSG_STATUS_BASE\s*=\s*(\d+)U'),
              ('STATUS_MAX', r'ATTINY_MSG_STATUS_MAX\s*=\s*(\d+)U', r'MSG_STATUS_MAX\s*=\s*(\d+)U'),
          ]
          for label, ep, tp in pairs:
              ev = number(cfg, ep, 'ESP ' + label)
              tv = number(tiny, tp, 'Tiny ' + label)
              if ev != tv:
                  raise SystemExit(f'{label} mismatch ESP={ev} Tiny={tv}')

          print(f'ATtiny protocol v{esp_proto}: contract OK')
          PY

      - name: Tao MQTT secret cho build deploy
        if: github.event_name != 'pull_request'
        env:
          MAYAP_MQTT_USERNAME: ${{ secrets.MAYAP_MQTT_USERNAME }}
          MAYAP_MQTT_PASSWORD: ${{ secrets.MAYAP_MQTT_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          username = os.getenv("MAYAP_MQTT_USERNAME", "")
          password = os.getenv("MAYAP_MQTT_PASSWORD", "")
          if not username or not password:
              raise SystemExit("Thieu GitHub Secrets: MAYAP_MQTT_USERNAME/MAYAP_MQTT_PASSWORD")

          Path("MAYAP_INDUSTRIAL_v3_4_0/build_secrets.h").write_text(
              "#pragma once\n"
              + "#define MAYAP_MQTT_USERNAME " + json.dumps(username) + "\n"
              + "#define MAYAP_MQTT_PASSWORD " + json.dumps(password) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Kiem tra JavaScript
        run: |
          node --check app.js
          node --check push.js
          node --check sw.js
          node --check config.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/auth.js
          node --check cloudflare/src/db.js
          node --check cloudflare/src/push.js

      - name: Bien dich ATtiny13A
        run: |
          mkdir -p build-attiny
          avr-g++ -x c++ \
            -mmcu=attiny13a \
            -DF_CPU=1200000UL \
            -Os -flto -std=gnu++11 \
            -ffunction-sections -fdata-sections \
            -fno-exceptions -fno-rtti \
            -Wall -Wextra \
            -Wl,--gc-sections \
            ATTINY13A_POWER_ALARM/ATTINY13A_POWER_ALARM.ino \
            -o build-attiny/ATTINY13A_POWER_ALARM.elf

          avr-size -C --mcu=attiny13a build-attiny/ATTINY13A_POWER_ALARM.elf
          read TEXT DATA BSS <<< "$(avr-size build-attiny/ATTINY13A_POWER_ALARM.elf | tail -n 1 | awk '{print $1, $2, $3}')"
          FLASH=$((TEXT + DATA))
          RAM=$((DATA + BSS))
          echo "ATtiny flash=${FLASH}/1024 bytes, static RAM=${RAM}/64 bytes"
          test "$FLASH" -le 1024 || { echo "::error::ATtiny flash vuot 1KB"; exit 1; }
          test "$RAM" -le 64 || { echo "::error::ATtiny static RAM vuot 64B"; exit 1; }

          avr-objcopy -O ihex -R .eeprom \
            build-attiny/ATTINY13A_POWER_ALARM.elf \
            build-attiny/ATTINY13A_POWER_ALARM.hex

      - name: Bien dich firmware ESP32
        run: |
          arduino-cli compile \
            --fqbn "${{ env.MAYAP_FQBN }}" \
            --output-dir ./build \
            --verbose \
            MAYAP_INDUSTRIAL_v3_4_0

      - name: Commit offline hardening sau khi ca hai firmware compile xanh
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore: execute offline hardening via build' }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAYAP_INDUSTRIAL_v3_4_0/config.h \
                  MAYAP_INDUSTRIAL_v3_4_0/attiny_bus.h \
                  MAYAP_INDUSTRIAL_v3_4_0/machine_control.h \
                  MAYAP_INDUSTRIAL_v3_4_0/hmi.h \
                  MAYAP_INDUSTRIAL_v3_4_0/MAYAP_INDUSTRIAL_v3_4_0.ino \
                  ATTINY13A_POWER_ALARM/ATTINY13A_POWER_ALARM.ino \
                  doc/attiny_power_alarm.md
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::Hardening patch khong tao thay doi source"; exit 1; }
          git commit -m "feat(offline): harden control and commissioning"
          git push origin HEAD:hardening/v3.8.0

      - name: Bao cao kich thuoc
        run: |
          ls -la ./build/*.bin
          ls -la ./build-attiny/*.hex

      - name: Luu firmware pilot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-pilot
          path: |
            ./build/MAYAP_INDUSTRIAL_v3_4_0.ino.bin
            ./build-attiny/ATTINY13A_POWER_ALARM.hex
          retention-days: 7

      - name: Doi ten file .bin theo tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp ./build/MAYAP_INDUSTRIAL_v3_4_0.ino.bin "./MAYAP-firmware-${VERSION}.bin"

      - name: Ky so firmware
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.MAYAP_OTA_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$OTA_SIGNING_PRIVATE_KEY" || { echo "::error::Thieu khoa ky OTA"; exit 1; }
          printf '%s\n' "$OTA_SIGNING_PRIVATE_KEY" > ota-signing-key.pem
          openssl dgst -sha256 -sign ota-signing-key.pem -out firmware.sig.der "./MAYAP-firmware-${GITHUB_REF_NAME#v}.bin"
          base64 -w0 firmware.sig.der > "./MAYAP-firmware-${GITHUB_REF_NAME#v}.sig"
          rm -f ota-signing-key.pem firmware.sig.der

      - name: Tao GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./MAYAP-firmware-*.bin
            ./MAYAP-firmware-*.sig
          generate_release_notes: true
