name: Validate & build

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mayap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAYAP_FQBN: esp32:esp32:esp32s3:PartitionScheme=default_8MB,FlashSize=8M,PSRAM=disabled
  ESP32_CORE_VERSION: 3.3.11
  U8G2_VERSION: 2.36.19
  PUBSUBCLIENT_VERSION: '2.8'
  ARDUINOJSON_VERSION: 7.4.2

jobs:
  validate:
    name: Kiem tra hop dong va Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kiem tra dong bo firmware, web, D1
        run: python3 scripts/check_consistency.py

      - name: Kiem tra cu phap JavaScript
        run: |
          node --check app.js
          node --check push.js
          node --check sw.js
          npm --prefix cloudflare run check

      - name: Unit test Worker
        run: npm --prefix cloudflare test

  firmware:
    name: Bien dich ESP32-S3 fail-closed
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chan credential bi dua vao CI
        run: test ! -e MAYAP_INDUSTRIAL_v3_4_0/secrets.h

      - name: Cai dat arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cai ESP32 core da khoa version
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}" --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Cai thu vien da khoa version
        run: |
          arduino-cli lib install "U8g2@${U8G2_VERSION}"
          arduino-cli lib install "PubSubClient@${PUBSUBCLIENT_VERSION}"
          arduino-cli lib install "ArduinoJson@${ARDUINOJSON_VERSION}"

      - name: Bien dich firmware
        run: |
          arduino-cli compile \
            --fqbn "${MAYAP_FQBN}" \
            --output-dir ./build \
            MAYAP_INDUSTRIAL_v3_4_0

      - name: Kiem tra kich thuoc va bam SHA-256
        run: |
          VERSION="$(sed -n 's/.*MAYAP_FIRMWARE_VERSION\[\].*"\([0-9][0-9.]*\)".*/\1/p' MAYAP_INDUSTRIAL_v3_4_0/config.h | head -1)"
          test -n "$VERSION"
          mkdir -p dist
          cp build/MAYAP_INDUSTRIAL_v3_4_0.ino.bin "dist/MAYAP-firmware-ci-${VERSION}.bin"
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('dist').glob('*.bin'))
          assert len(files) == 1
          assert 0 < files[0].stat().st_size <= 0x330000
          PY
          sha256sum "dist/MAYAP-firmware-ci-${VERSION}.bin" > "dist/MAYAP-firmware-ci-${VERSION}.bin.sha256"

      # Artifact nay chi de review ket qua build, KHONG duoc nap cho may giao
      # khach: no co chu dich khong chua broker/credential production.
      - name: Luu artifact kiem chung
        uses: actions/upload-artifact@v4
        with:
          name: mayap-firmware-ci-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
