name: Fix Wi-Fi show-password HTML escaping

on:
  push:
    branches:
      - hardening/v3.8.1-reliability
    paths:
      - .github/wifi-showpass-html-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: hardening/v3.8.1-reliability
          fetch-depth: 0

      - name: Correct portal HTML escaping
        run: python tools/fix_wifi_showpass_html_escape.py

      - name: Run reliability checks
        run: python tools/check_v381_reliability.py

      - name: Verify generated C++ source literal
        shell: bash
        run: |
          grep -F 'WIFI_PORTAL_MAX_OPEN_MS = 120000UL' MAYAP_INDUSTRIAL_v3_4_0/config.h
          grep -F 'WIFI_PORTAL_UI_IDLE_TIMEOUT_MS = 120000UL' MAYAP_INDUSTRIAL_v3_4_0/config.h
          grep -F 'id=showPassword' MAYAP_INDUSTRIAL_v3_4_0/network_service.h
          grep -F 'onchange=\"document.getElementById' MAYAP_INDUSTRIAL_v3_4_0/network_service.h
          if grep -F 'onchange=\\\"' MAYAP_INDUSTRIAL_v3_4_0/network_service.h; then
            echo 'double escaped onchange remains' >&2
            exit 1
          fi

      - name: Commit clean source
        shell: bash
        run: |
          rm -f tools/fix_wifi_showpass_html_escape.py
          rm -f .github/workflows/fix-wifi-showpass-html.yml
          rm -f .github/wifi-showpass-html-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(wifi): correct show-password portal HTML escaping'
          git push origin HEAD:hardening/v3.8.1-reliability
