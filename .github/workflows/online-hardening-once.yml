name: One-shot online security hardening

on:
  push:
    branches:
      - hardening/v3.8.0

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: contains(github.event.head_commit.message, '[online-hardening-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening/v3.8.0

      - name: Apply guarded source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          rt = 'MAYAP_INDUSTRIAL_v3_4_0/realtime_link.h'

          replace_once(
              rt,
              '  const uint32_t sequence = doc["sequence"] | 0UL;\n  const char *action = doc["action"] | "";\n',
              '  const uint32_t sequence = doc["sequence"] | 0UL;\n'
              '  const uint32_t messageBootId = doc["bootId"] | 0UL;\n'
              '  const char *action = doc["action"] | "";\n',
              'command bootId fields')

          replace_once(
              rt,
              '  // Chong lap: web co the phat lai cung mot lenh khi mat goi ACK. Sequence\n'
              '  // tang dan tu web; requestId trung cung la dau hieu lap.\n'
              '  if (requestId[0] && !strcmp(requestId, lastCommandRequestId)) {\n'
              '    publishAck(requestId, "duplicate", "");\n'
              '    return;\n'
              '  }\n'
              '  if (sequence != 0U && lastCommandSequence != 0U &&\n'
              '      sequence <= lastCommandSequence) {\n'
              '    publishAck(requestId, "stale", "");\n'
              '    return;\n'
              '  }\n',
              '  // Lenh dieu khien PHAI co requestId, sequence va bootId hop le.\n'
              '  // bootId thay doi moi lan khoi dong, nen packet cua boot cu bi vo hieu.\n'
              '  if (!requestId[0] || sequence == 0U) {\n'
              '    publishAck(requestId, "invalid", "");\n'
              '    return;\n'
              '  }\n'
              '  if (messageBootId == 0U || messageBootId != bootId) {\n'
              '    publishAck(requestId, "stale", "");\n'
              '    return;\n'
              '  }\n'
              '\n'
              '  // Chong lap trong cung boot: requestId khong duoc lap va sequence phai tang.\n'
              '  if (!strcmp(requestId, lastCommandRequestId)) {\n'
              '    publishAck(requestId, "duplicate", "");\n'
              '    return;\n'
              '  }\n'
              '  if (lastCommandSequence != 0U && sequence <= lastCommandSequence) {\n'
              '    publishAck(requestId, "stale", "");\n'
              '    return;\n'
              '  }\n',
              'command replay checks')

          replace_once(
              rt,
              '  if (type == HmiCommandType::None) {\n'
              '    publishAck(requestId, "unsupported", "");\n'
              '    return;\n'
              '  }\n\n'
              '  // "Coi bao" tren dashboard tat tam giong het nut ACK tren HMI (xem\n',
              '  if (type == HmiCommandType::None) {\n'
              '    publishAck(requestId, "unsupported", "");\n'
              '    return;\n'
              '  }\n\n'
              '  // Rollback thay doi firmware dang boot. Kenh MQTT hien dung credential\n'
              '  // chung, nen rollback tu xa bi khoa. Rollback van dung duoc tren HMI\n'
              '  // voi man xac nhan CO/HUY da co san.\n'
              '  if (type == HmiCommandType::FirmwareRollback) {\n'
              '    publishAck(requestId, "rejected", "QUAY LAI CAN XAC NHAN TAI MAY");\n'
              '    return;\n'
              '  }\n\n'
              '  // "Coi bao" tren dashboard tat tam giong het nut ACK tren HMI (xem\n',
              'remote rollback gate')

          replace_once(
              rt,
              '  const uint32_t revision = doc["revision"] | 0UL;\n\n'
              '  portENTER_CRITICAL(&webMux);\n'
              '  const bool busy = pendingConfigSave.used;\n'
              '  const bool haveBase = knownConfigValid;\n'
              '  MachineConfig candidate = knownConfig;\n'
              '  portEXIT_CRITICAL(&webMux);\n\n'
              '  if (busy) {\n',
              '  const uint32_t revision = doc["revision"] | 0UL;\n'
              '  if (!requestId[0] || revision == 0U) {\n'
              '    publishAck(requestId, "invalid", "");\n'
              '    return;\n'
              '  }\n\n'
              '  portENTER_CRITICAL(&webMux);\n'
              '  const bool busy = pendingConfigSave.used;\n'
              '  const bool haveBase = knownConfigValid;\n'
              '  const uint32_t currentRevision = webConfigRevision;\n'
              '  MachineConfig candidate = knownConfig;\n'
              '  portEXIT_CRITICAL(&webMux);\n\n'
              '  if (currentRevision != 0U && revision <= currentRevision) {\n'
              '    publishAck(requestId, "stale", "");\n'
              '    return;\n'
              '  }\n'
              '  if (busy) {\n',
              'config replay checks')

          replace_once(
              rt,
              '  const uint32_t revision = doc["revision"] | 0UL;\n\n'
              '  portENTER_CRITICAL(&webMux);\n'
              '  const bool busy = pendingReminderSave.used;\n'
              '  portEXIT_CRITICAL(&webMux);\n'
              '  if (busy) {\n',
              '  const uint32_t revision = doc["revision"] | 0UL;\n'
              '  if (!requestId[0] || revision == 0U) {\n'
              '    publishAck(requestId, "invalid", "");\n'
              '    return;\n'
              '  }\n\n'
              '  portENTER_CRITICAL(&webMux);\n'
              '  const bool busy = pendingReminderSave.used;\n'
              '  const uint32_t currentRevision = webRemindersRevision;\n'
              '  portEXIT_CRITICAL(&webMux);\n'
              '  if (currentRevision != 0U && revision <= currentRevision) {\n'
              '    publishAck(requestId, "stale", "");\n'
              '    return;\n'
              '  }\n'
              '  if (busy) {\n',
              'reminder replay checks')

          app = 'app.js'
          replace_once(
              app,
              "    $('firmwareRollbackBtn')?.addEventListener('click', () => {\n"
              "      // Hanh dong hiem gap, gay khoi dong lai ngay - can 1 buoc xac nhan ro\n"
              "      // rang truoc khi gui, tranh bam nham (khac batch/cai dat thong thuong\n"
              "      // von khong can vi de sua lai duoc).\n"
              "      const ok = window.confirm(\n"
              "        'Quay lại firmware trước đó?\\\\n\\\\nMáy sẽ khởi động lại ngay. Chỉ nên làm khi bản hiện tại đang có lỗi.'\n"
              "      );\n"
              "      if (ok) sendCommand('firmware_rollback');\n"
              "    });\n",
              "    $('firmwareRollbackBtn')?.addEventListener('click', () => {\n"
              "      // Rollback chi duoc xac nhan vat ly tren HMI; web khong gui MQTT.\n"
              "      toast('Quay lại firmware phải xác nhận trực tiếp trên màn hình máy: Cài đặt → Hệ thống → Quay lại bản cũ.', 6500);\n"
              "    });\n",
              'web rollback button')
          PY

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli lib install U8g2@2.36.19 PubSubClient@2.8.0 ArduinoJson@7.4.3

      - name: Compile hardened firmware
        env:
          MAYAP_MQTT_USERNAME: ${{ secrets.MAYAP_MQTT_USERNAME }}
          MAYAP_MQTT_PASSWORD: ${{ secrets.MAYAP_MQTT_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          u = os.getenv('MAYAP_MQTT_USERNAME', '')
          p = os.getenv('MAYAP_MQTT_PASSWORD', '')
          if not u or not p:
              raise SystemExit('Missing MAYAP_MQTT_USERNAME/MAYAP_MQTT_PASSWORD')
          Path('MAYAP_INDUSTRIAL_v3_4_0/build_secrets.h').write_text(
              '#pragma once\n#define MAYAP_MQTT_USERNAME ' + json.dumps(u) +
              '\n#define MAYAP_MQTT_PASSWORD ' + json.dumps(p) + '\n', encoding='utf-8')
          PY
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,PartitionScheme=default_8MB,FlashSize=8M,PSRAM=disabled' \
            --output-dir ./build-online-hardening \
            MAYAP_INDUSTRIAL_v3_4_0

      - name: Verify diff
        run: |
          rm -f MAYAP_INDUSTRIAL_v3_4_0/build_secrets.h
          git diff --check
          git diff -- MAYAP_INDUSTRIAL_v3_4_0/realtime_link.h app.js

      - name: Commit verified patch and remove one-shot workflow
        run: |
          rm -f .github/workflows/online-hardening-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security(online): block remote rollback and stale MQTT writes'
          git push origin HEAD:hardening/v3.8.0
