name: Repair v3.8.2 patch script v2

on:
  push:
    branches:
      - hardening/v3.8.2-humidity
    paths:
      - .github/workflows/fix-v382-patch-script-v2.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repair exact return fragments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patch-v382-features.yml')
          s = p.read_text(encoding='utf-8')
          old1 = 'c.sirenSelfTestEnabled = p.sirenSelfTestEnabled != 0U;\\n  return c;'
          new1 = 'c.sirenSelfTestEnabled = p.sirenSelfTestEnabled != 0U;\\n  sanitizeMachineConfig(c);\\n  return c;'
          old2 = 'c.ventScheduleHour6 = p.ventScheduleHour6;\\n  return c;'
          new2 = 'c.ventScheduleHour6 = p.ventScheduleHour6;\\n  sanitizeMachineConfig(c);\\n  return c;'
          if s.count(old1) != 1:
              raise SystemExit(f'old1 count={s.count(old1)}')
          if s.count(old2) != 1:
              raise SystemExit(f'old2 count={s.count(old2)}')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'Kiều Việt'
          git config user.email '120502812+Kqviet1810@users.noreply.github.com'
          git add .github/workflows/patch-v382-features.yml
          git commit -m 'fix: make v3.8.2 patch script match unpack sanitize'
          git push origin HEAD:hardening/v3.8.2-humidity
