name: Apply Wi-Fi portal UX patch

on:
  push:
    branches:
      - hardening/v3.8.1-reliability
    paths:
      - .github/wifi-portal-ux-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: hardening/v3.8.1-reliability
          fetch-depth: 0

      - name: Apply requested changes
        run: python tools/apply_wifi_portal_2min_showpass.py

      - name: Run reliability checks
        run: python tools/check_v381_reliability.py

      - name: Verify exact UX requirements
        shell: bash
        run: |
          grep -F 'WIFI_PORTAL_MAX_OPEN_MS = 120000UL' MAYAP_INDUSTRIAL_v3_4_0/config.h
          grep -F 'WIFI_PORTAL_UI_IDLE_TIMEOUT_MS = 120000UL' MAYAP_INDUSTRIAL_v3_4_0/config.h
          grep -F 'id=showPassword' MAYAP_INDUSTRIAL_v3_4_0/network_service.h
          grep -F "this.checked?'text':'password'" MAYAP_INDUSTRIAL_v3_4_0/network_service.h

      - name: Commit final source and remove one-shot files
        shell: bash
        run: |
          rm -f tools/apply_wifi_portal_2min_showpass.py
          rm -f .github/workflows/apply-wifi-portal-ux.yml
          rm -f .github/wifi-portal-ux-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(wifi): extend portal to 2 minutes and show password'
          git push origin HEAD:hardening/v3.8.1-reliability
