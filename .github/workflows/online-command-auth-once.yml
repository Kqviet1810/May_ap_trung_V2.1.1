name: Apply online command auth once

on:
  push:
    branches:
      - hardening/v3.8.0
    paths:
      - .github/workflows/online-command-auth-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v3.8.0
          fetch-depth: 0

      - name: Apply guarded source patch
        shell: bash
