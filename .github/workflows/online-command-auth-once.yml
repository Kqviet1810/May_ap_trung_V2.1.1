              'static char activeKey[65] = "";\nstatic char commandKey[65] = "";\nstatic char webPin[9] = "";\nstatic bool webPinConfigured = false;\n')
          replace_once(p,
              "  activeKey[0] = '\\0';\n  webPin[0] = '\\0';\n",
              "  activeKey[0] = '\\0';\n  commandKey[0] = '\\0';\n  webPin[0] = '\\0';\n")
          replace_once(p,
              '  const String storedKey = prefs.getString("device-key", "");\n',
              '  const String storedCommandKey = prefs.getString("command-key", "");\n'
              '  if (storedCommandKey.length() == 64U) {\n'
              '    strlcpy(commandKey, storedCommandKey.c_str(), sizeof(commandKey));\n'
              '  }\n\n'
              '  const String storedKey = prefs.getString("device-key", "");\n')
          insert_after = '''inline const char *mayapDeviceSecret() {
  return MayapDeviceIdentityInternal::activeKey;
}
'''
          addition = '''inline const char *mayapDeviceSecret() {
  return MayapDeviceIdentityInternal::activeKey;
}

inline bool mayapStoreCommandKey(const char *key) {
  using namespace MayapDeviceIdentityInternal;
  if (!key || strlen(key) != 64U) return false;
  for (size_t i = 0; i < 64U; ++i) {
    const char c = key[i];
    if (!((c >= '0' && c <= '9') || (c >= 'a' && c <= 'f') ||
          (c >= 'A' && c <= 'F'))) return false;
  }
  Preferences prefs;
  if (!prefs.begin("mayap-id", false)) return false;
  const bool ok = prefs.putString("command-key", key) > 0U;
  prefs.end();
  if (ok) strlcpy(commandKey, key, sizeof(commandKey));
  return ok;
}

inline const char *mayapCommandKey() {
  return MayapDeviceIdentityInternal::commandKey;
}
