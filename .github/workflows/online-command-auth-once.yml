              '# (VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, DEVICE_KEY_PEPPER,\n# MAYAP_MQTT_PASSWORD, GITHUB_TOKEN tuy chon cho tinh nang cap nhat firmware) bang\n')

          print('online command authentication patch applied')
          PY

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/db.js

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/online-command-auth-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security(online): authenticate MQTT writes per device"
          git push origin HEAD:hardening/v3.8.0
