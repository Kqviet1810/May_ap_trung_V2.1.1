name: Apply MQTT build guard

on:
  push:
    branches:
      - hardening/v3.8.1-reliability
    paths:
      - '.mqtt-build-guard-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: hardening/v3.8.1-reliability
          fetch-depth: 0

      - name: Apply MQTT build guard
        run: python3 tools/apply_mqtt_build_guard.py

      - name: Run regression checks before commit
        run: |
          python3 tools/check_release_sync.py
          python3 tools/check_v381_reliability.py

      - name: Remove one-shot tooling
        run: |
          rm -f tools/apply_mqtt_build_guard.py
          rm -f .github/workflows/apply-mqtt-build-guard.yml
          rm -f .mqtt-build-guard-trigger

      - name: Commit hardened source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(mqtt): fail build when broker credentials are missing"
          git push origin HEAD:hardening/v3.8.1-reliability
