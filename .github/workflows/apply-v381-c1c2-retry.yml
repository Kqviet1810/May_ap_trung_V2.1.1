name: Retry v3.8.1 C1-C2 remediation

on:
  push:
    branches:
      - hardening/v3.8.1-reliability

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: hardening/v3.8.1-reliability
          fetch-depth: 2

      - name: Relax only the E502 enum matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_v381_c1c2_fixes.py')
          s = p.read_text(encoding='utf-8')
          old = "t = exact(t, '  SirenBatteryLow = 502,\\n', '', \"remove E502 enum\")"
          new = "t = rex(t, r'^\\s*SirenBatteryLow = 502,.*?\\n', '', \"remove E502 enum\", flags=re.MULTILINE)"
          if s.count(old) != 1:
              raise SystemExit('E502 matcher source not unique')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Apply guarded source patch
        run: python3 tools/apply_v381_c1c2_fixes.py

      - name: Validate JavaScript and regression gates
        run: |
          node --check app.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/security-wrapper.js
          node --check cloudflare/src/reliability-wrapper.js
          python3 tools/check_release_sync.py
          python3 tools/check_v381_reliability.py
          git diff --check

      - name: Remove one-shot patch machinery
        run: |
          git rm tools/apply_v381_c1c2_fixes.py
          git rm .github/workflows/apply-v381-c1c2-once.yml
          git rm .github/workflows/apply-v381-c1c2-retry.yml

      - name: Commit verified remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::Patch produced no changes"; exit 1; }
          git commit -m "fix(v3.8.1): resolve C1/C2 safety and lifecycle findings"
          git push origin HEAD:hardening/v3.8.1-reliability
