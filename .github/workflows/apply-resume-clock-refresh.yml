name: One-shot resume clock refresh

on:
  push:
    branches:
      - hardening/v3.8.1-attiny-activity-alarm
    paths:
      - '.github/resume-clock-refresh-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/v3.8.1-attiny-activity-alarm

      - name: Patch pending-resume elapsed clock
        run: |
          python3 - <<'PY'
          from pathlib import Path

          machine_path = Path('MAYAP_INDUSTRIAL_v3_4_0/machine_control.h')
          machine = machine_path.read_text(encoding='utf-8')

          anchor = '''  void processResume(uint32_t now) {\n    if (!resumePending_) {\n'''
          helper = '''  // Trong luc dang CHO xac nhan/cho dieu kien phuc hoi, thoi gian sinh hoc\n  // cua me van tiep tuc troi. Checkpoint + RTC la moc that, khong de dong ho\n  // dung lai chi vi nguoi dung chua bam Tiep tuc. Khong ghi flash tai day;\n  // checkpointGate van la noi duy nhat luu dinh ky.\n  void refreshPendingResumeElapsedFromRtc() {\n    if (!resumePending_ || lastCheckpointEpoch_ == 0U || !rtc_.valid()) return;\n    const uint32_t currentEpoch = rtc_.epoch();\n    if (currentEpoch < lastCheckpointEpoch_) return;\n    const uint32_t delta = currentEpoch - lastCheckpointEpoch_;\n    if (delta > MAX_RTC_RECOVERY_GAP_SEC) return;\n    const uint64_t corrected = static_cast<uint64_t>(savedElapsedAtCheckpoint_) + delta;\n    const uint32_t refreshed = corrected > UINT32_MAX\n        ? UINT32_MAX : static_cast<uint32_t>(corrected);\n    if (refreshed > elapsedBeforeStartSec_) elapsedBeforeStartSec_ = refreshed;\n  }\n\n  void processResume(uint32_t now) {\n    if (!resumePending_) {\n'''
          if machine.count(anchor) != 1:
              raise SystemExit(f'processResume anchor count={machine.count(anchor)}')
          machine = machine.replace(anchor, helper, 1)

          call_anchor = '''      return;\n    }\n    if (resumeConfirmationRequired_) {\n'''
          call_repl = '''      return;\n    }\n\n    // Cap nhat ngay/elapsed TRUOC moi nhanh return cua recovery (ke ca dang\n    // cho xac nhan, AUTO, heater, sensor hay powerRestoreDelay).\n    refreshPendingResumeElapsedFromRtc();\n\n    if (resumeConfirmationRequired_) {\n'''
          if machine.count(call_anchor) != 1:
              raise SystemExit(f'confirmation anchor count={machine.count(call_anchor)}')
          machine = machine.replace(call_anchor, call_repl, 1)
          machine_path.write_text(machine, encoding='utf-8')

          checker_path = Path('tools/check_v381_reliability.py')
          checker = checker_path.read_text(encoding='utf-8')
          checker_anchor = 'require(machine, "keepPowerLossArmed", "batch-stop no-gap handoff")\n'
          checker_add = '''require(machine, "refreshPendingResumeElapsedFromRtc();", "pending resume elapsed follows RTC")\nrequire(machine, "savedElapsedAtCheckpoint_) + delta", "pending resume elapsed uses checkpoint anchor")\n'''
          if checker.count(checker_anchor) != 1:
              raise SystemExit('checker anchor mismatch')
          checker = checker.replace(checker_anchor, checker_anchor + checker_add, 1)
          checker_path.write_text(checker, encoding='utf-8')
          PY

      - name: Regression checks
        run: |
          python3 tools/check_release_sync.py
          python3 tools/check_v381_reliability.py
          git diff --check

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAYAP_INDUSTRIAL_v3_4_0/machine_control.h tools/check_v381_reliability.py
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "fix(recovery): keep batch elapsed running while resume is pending"
          git push origin HEAD:hardening/v3.8.1-attiny-activity-alarm
