name: One-shot Wi-Fi portal panic hardening

on:
  push:
    branches:
      - hardening/v3.8.1-reliability
    paths:
      - .github/workflows/portal-panic-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/v3.8.1-reliability
          fetch-depth: 0

      - name: Close quiesce cancel race
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          netp = Path('MAYAP_INDUSTRIAL_v3_4_0/network_service.h')
          checkp = Path('tools/check_v381_reliability.py')
          net = netp.read_text(encoding='utf-8')
          old = '''  if (portalPhase != PortalPhase::Idle) {
    // Neu dang o STA co ket noi that thi giu nguyen; chi tat AP.
    WiFi.softAPdisconnect(true);
    WiFi.mode(WIFI_STA);
  }
'''
          new = '''  // Quiescing nghia la AP CHUA duoc bat va otaTask co the chua ACK.
  // Huy dung o pha nay tuyet doi khong duoc cham radio; chi khi da qua
  // quiesce moi co quyen tat AP/doi mode.
  if (portalPhase != PortalPhase::Idle &&
      portalPhase != PortalPhase::Quiescing) {
    WiFi.softAPdisconnect(true);
    WiFi.mode(WIFI_STA);
  }
'''
          if old not in net:
              raise SystemExit('portalStop anchor missing')
          net = net.replace(old, new, 1)
          netp.write_text(net, encoding='utf-8')

          check = checkp.read_text(encoding='utf-8')
          anchor = 'require(network, "portalOtaQuiescedFlag", "portal/OTA quiesce handshake")\n'
          add = anchor + 'require(network, "portalPhase != PortalPhase::Quiescing", "cancel during quiesce must not touch radio")\n'
          if anchor not in check:
              raise SystemExit('checker anchor missing')
          check = check.replace(anchor, add, 1)
          checkp.write_text(check, encoding='utf-8')
          PY

      - name: Static checks
        run: |
          python3 tools/check_release_sync.py
          python3 tools/check_v381_reliability.py
          git diff --check

      - name: Commit race closure
        run: |
          git config user.name "Kiều Việt"
          git config user.email "120502812+Kqviet1810@users.noreply.github.com"
          git add MAYAP_INDUSTRIAL_v3_4_0/network_service.h tools/check_v381_reliability.py
          git commit -m "fix(v3.8.1): make portal cancel quiesce-safe"
          git push origin HEAD:hardening/v3.8.1-reliability
