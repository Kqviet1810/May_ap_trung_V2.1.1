name: Apply v3.8.2 humidity integration

on:
  push:
    branches:
      - hardening/v3.8.2-humidity
    paths:
      - .github/workflows/apply-humidity-v382.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply focused humidity patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Firmware contract / GPIO / config + runtime
          # ------------------------------------------------------------------
          path = 'MAYAP_INDUSTRIAL_v3_4_0/config.h'
          s = read(path)
          s = replace_once(s,
              'constexpr char MAYAP_FIRMWARE_VERSION[] = "3.8.1";',
              'constexpr char MAYAP_FIRMWARE_VERSION[] = "3.8.2";',
              'firmware version')
          s = replace_once(s,
              'constexpr float HUMIDITY_HIGH_ALARM_C = 85.0f;\nconstexpr float HUMIDITY_HIGH_HYSTERESIS_C = 2.0f;',
              'constexpr float HUMIDITY_HIGH_ALARM_C = 85.0f;\nconstexpr float HUMIDITY_HIGH_HYSTERESIS_C = 2.0f;\n// Tao am 1 relay: OFF->ON khi RH <= setpoint - 2%%, giu ON den khi dat setpoint.\n// Khong dung PID de tranh relay dong/ngat lien tuc.\nconstexpr float HUMIDIFIER_HYSTERESIS_RH = 2.0f;',
              'humidity hysteresis')
          if s.count('PIN_OUT_RELAY_SPARE') != 2:
              raise SystemExit(f'config PIN_OUT_RELAY_SPARE count={s.count("PIN_OUT_RELAY_SPARE")}')
          s = s.replace('PIN_OUT_RELAY_SPARE', 'PIN_OUT_HUMIDIFIER')
          s = s.replace('// rele du, chua gan chuc nang', '// relay tao am tuy chon, mac dinh TAT')
          s = replace_once(s,
              '  float lowHumidityAlarm = 45.0f;\n  uint16_t humidityAlarmDelaySec = 60;\n\n  bool circulationFanEnabled = true;',
              '  float lowHumidityAlarm = 45.0f;\n  uint16_t humidityAlarmDelaySec = 60;\n  // Tao am la tuy chon theo tung may. Mac dinh TAT de may khong lap bo tao am\n  // van dung cung firmware ma GPIO48 luon o trang thai an toan OFF.\n  bool humidifierEnabled = false;\n  float targetHumidity = 58.0f;\n\n  bool circulationFanEnabled = true;',
              'MachineConfig humidity fields')
          s = replace_once(s,
              '  bool circulationFanOn = false;\n  bool ventFanOn = false;\n  bool lightOn = false;',
              '  bool circulationFanOn = false;\n  bool ventFanOn = false;\n  bool humidifierOn = false;\n  bool lightOn = false;',
              'MachineRuntime humidifier state')
          write(path, s)

          # ------------------------------------------------------------------
          # Main controller / EEPROM compatibility / output arbiter
          # ------------------------------------------------------------------
          path = 'MAYAP_INDUSTRIAL_v3_4_0/machine_control.h'
          s = read(path)
          if s.count('PIN_OUT_RELAY_SPARE') < 1 or s.count('relaySpare') < 1 or s.count('RelaySpare') < 1:
              raise SystemExit('expected spare relay identifiers not found')
          s = s.replace('PIN_OUT_RELAY_SPARE', 'PIN_OUT_HUMIDIFIER')
          s = s.replace('relaySpare', 'humidifier')
          s = s.replace('RelaySpare', 'Humidifier')
          s = replace_once(s,
              '  if (!isfinite(cfg.lowHumidityAlarm)) cfg.lowHumidityAlarm = defaults.lowHumidityAlarm;',
              '  if (!isfinite(cfg.lowHumidityAlarm)) cfg.lowHumidityAlarm = defaults.lowHumidityAlarm;\n  if (!isfinite(cfg.targetHumidity)) cfg.targetHumidity = defaults.targetHumidity;',
              'sanitize targetHumidity finite')
          s = replace_once(s,
              '  cfg.lowHumidityAlarm = clampFloat(cfg.lowHumidityAlarm, 10.0f, 90.0f);\n  cfg.humidityAlarmDelaySec = static_cast<uint16_t>(constrain(\n      static_cast<int>(cfg.humidityAlarmDelaySec), 0, 600));',
              '  cfg.lowHumidityAlarm = clampFloat(cfg.lowHumidityAlarm, 10.0f, 90.0f);\n  cfg.humidityAlarmDelaySec = static_cast<uint16_t>(constrain(\n      static_cast<int>(cfg.humidityAlarmDelaySec), 0, 600));\n  cfg.targetHumidity = clampFloat(cfg.targetHumidity, 30.0f, 90.0f);',
              'sanitize targetHumidity range')
          s = replace_once(s,
              '  p.lowHumidityAlarm = c.lowHumidityAlarm;\n  p.humidityAlarmDelaySec = c.humidityAlarmDelaySec;\n  p.circulationFanEnabled = c.circulationFanEnabled ? 1U : 0U;',
              '  p.lowHumidityAlarm = c.lowHumidityAlarm;\n  // Giu nguyen CONFIG_SCHEMA=10 va kich thuoc record: bit15 cua delay (thuc te\n  // chi 0..600) luu enable, byte circulationFanEnabled cu (RAM luon ep true)\n  // luu setpoint RH nguyen 30..90. Firmware cu van doc byte nay la true.\n  p.humidityAlarmDelaySec = static_cast<uint16_t>(c.humidityAlarmDelaySec & 0x7FFFU) |\n      (c.humidifierEnabled ? 0x8000U : 0U);\n  p.circulationFanEnabled = static_cast<uint8_t>(constrain(\n      static_cast<int>(lroundf(c.targetHumidity)), 30, 90));',
              'pack humidity option without schema churn')
          s = replace_once(s,
              '  c.lowHumidityAlarm = p.lowHumidityAlarm;\n  c.humidityAlarmDelaySec = p.humidityAlarmDelaySec;\n  c.circulationFanEnabled = p.circulationFanEnabled != 0U;',
              '  c.lowHumidityAlarm = p.lowHumidityAlarm;\n  c.humidifierEnabled = (p.humidityAlarmDelaySec & 0x8000U) != 0U;\n  c.humidityAlarmDelaySec = static_cast<uint16_t>(p.humidityAlarmDelaySec & 0x7FFFU);\n  c.targetHumidity = (p.circulationFanEnabled >= 30U && p.circulationFanEnabled <= 90U)\n      ? static_cast<float>(p.circulationFanEnabled) : MachineConfig{}.targetHumidity;\n  c.circulationFanEnabled = true;',
              'unpack humidity option compatibly')
          s = replace_once(s,
              '    req.siren = ((emergencyActive_ || batchOverdueSirenActive_) &&\n                 timeReached(now, sirenMutedUntil_)) || sirenSelfTestActive_;\n\n    outputs_.update(now, req);',
              '    req.siren = ((emergencyActive_ || batchOverdueSirenActive_) &&\n                 timeReached(now, sirenMutedUntil_)) || sirenSelfTestActive_;\n\n    // Tao am chi hoat dong trong me, khi cam bien hop le. Hysteresis 2%%RH:\n    // dang OFF thi chi bat khi <= SV-2; dang ON thi giu den khi dat SV.\n    // Moi nhanh safe/fault cua OutputArbiter van co quyen ep relay OFF ngay.\n    const bool humidifierPermit = config_.humidifierEnabled && batchRunning_ &&\n                                  sensorUsable_ && !faults_.masterDropRequired();\n    if (humidifierPermit) {\n      if (outputs_.state().humidifier) {\n        req.humidifier = humidity_ < config_.targetHumidity;\n      } else {\n        req.humidifier = humidity_ <=\n            (config_.targetHumidity - HUMIDIFIER_HYSTERESIS_RH);\n      }\n    }\n\n    outputs_.update(now, req);',
              'humidity control insertion')
          s = replace_once(s,
              '    runtime_.circulationFanOn = outputs_.state().circulationFan;\n    runtime_.ventFanOn = outputs_.state().ventFan;\n    runtime_.lightOn = outputs_.state().light;',
              '    runtime_.circulationFanOn = outputs_.state().circulationFan;\n    runtime_.ventFanOn = outputs_.state().ventFan;\n    runtime_.humidifierOn = outputs_.state().humidifier;\n    runtime_.lightOn = outputs_.state().light;',
              'runtime humidifier feedback')
          write(path, s)

          # ------------------------------------------------------------------
          # HMI: append a group, do not shift legacy absolute group indices.
          # ------------------------------------------------------------------
          path = 'MAYAP_INDUSTRIAL_v3_4_0/hmi.h'
          s = read(path)
          s = replace_once(s,
              '  ITEM_BOOL("Tu kiem tra coi", sirenSelfTestEnabled)                        // 29\n};',
              '  ITEM_BOOL("Tu kiem tra coi", sirenSelfTestEnabled),                       // 29\n\n  // ---- CAI DAT CHUNG > TAO AM (2 muc, them CUOI de khong doi index cu) ----\n  ITEM_BOOL("Tao am", humidifierEnabled),                                      // 30\n  ITEM_FLOAT("Do am dat", targetHumidity, 30.0f, 90.0f, 1.0f, 0, "%")          // 31\n};',
              'HMI humidity settings')
          s = replace_once(s,
              '  {"HE THONG", 15, 2},\n  {"NANG CAO", 17, 13}\n};',
              '  {"HE THONG", 15, 2},\n  {"NANG CAO", 17, 13},\n  {"TAO AM", 30, 2}\n};',
              'HMI humidity group')
          s = replace_once(s,
              '      offset == offsetof(MachineConfig, lowHumidityAlarm) ||\n      offset == offsetof(MachineConfig, ventOnTemp) ||',
              '      offset == offsetof(MachineConfig, lowHumidityAlarm) ||\n      offset == offsetof(MachineConfig, humidifierEnabled) ||\n      offset == offsetof(MachineConfig, targetHumidity) ||\n      offset == offsetof(MachineConfig, ventOnTemp) ||',
              'HMI humidity editable during batch')
          s = replace_once(s,
              '  snprintf(text, sizeof(text), currentRuntime.sensorOnline ? "AM %.0f%%" : "AM --%%",\n           currentRuntime.humidity);\n  lcd.drawStr(RIGHT_X, 34, text);',
              '  if (currentRuntime.sensorOnline) {\n    snprintf(text, sizeof(text), currentRuntime.humidifierOn ? "AM %.0f%%+" : "AM %.0f%%",\n             currentRuntime.humidity);\n  } else {\n    snprintf(text, sizeof(text), "AM --%%");\n  }\n  lcd.drawStr(RIGHT_X, 34, text);',
              'HMI home humidifier indicator')
          write(path, s)

          # ------------------------------------------------------------------
          # MQTT realtime contract
          # ------------------------------------------------------------------
          path = 'MAYAP_INDUSTRIAL_v3_4_0/realtime_link.h'
          s = read(path)
          s = replace_once(s,
              '  c["lowHumidityAlarm"] = cfg.lowHumidityAlarm;\n  c["ventOnTemp"] = cfg.ventOnTemp;',
              '  c["lowHumidityAlarm"] = cfg.lowHumidityAlarm;\n  c["humidifierEnabled"] = cfg.humidifierEnabled;\n  c["targetHumidity"] = cfg.targetHumidity;\n  c["ventOnTemp"] = cfg.ventOnTemp;',
              'MQTT publish humidity config')
          s = replace_once(s,
              '  candidate.lowHumidityAlarm = configObj["lowHumidityAlarm"] | candidate.lowHumidityAlarm;\n  candidate.ventOnTemp = configObj["ventOnTemp"] | candidate.ventOnTemp;',
              '  candidate.lowHumidityAlarm = configObj["lowHumidityAlarm"] | candidate.lowHumidityAlarm;\n  candidate.humidifierEnabled = configObj["humidifierEnabled"] | candidate.humidifierEnabled;\n  candidate.targetHumidity = configObj["targetHumidity"] | candidate.targetHumidity;\n  candidate.ventOnTemp = configObj["ventOnTemp"] | candidate.ventOnTemp;',
              'MQTT receive humidity config')
          s = replace_once(s,
              '  r["circulationFanOn"] = rt.circulationFanOn;\n  r["ventFanOn"] = rt.ventFanOn;\n  r["lightOn"] = rt.lightOn;',
              '  r["circulationFanOn"] = rt.circulationFanOn;\n  r["ventFanOn"] = rt.ventFanOn;\n  r["humidifierOn"] = rt.humidifierOn;\n  r["lightOn"] = rt.lightOn;',
              'MQTT humidifier runtime')
          write(path, s)

          # ------------------------------------------------------------------
          # Web UI + config protocol
          # ------------------------------------------------------------------
          path = 'index.html'
          s = read(path)
          s = replace_once(s,
              '<div><span>Thông gió</span><strong id="outputVent">TẮT</strong></div>\n<div><span>Đảo trứng</span><strong id="outputTurn">CHỜ</strong></div>',
              '<div><span>Thông gió</span><strong id="outputVent">TẮT</strong></div>\n<div><span>Tạo ẩm</span><strong id="outputHumidifier">TẮT</strong></div>\n<div><span>Đảo trứng</span><strong id="outputTurn">CHỜ</strong></div>',
              'web humidifier output tile')
          s = replace_once(s,
              '<label class="compactTile"><span>Độ ẩm tham khảo</span><div class="unit"><input id="targetHumidity" max="95" min="20" type="number" value="58"/><b>%RH</b></div></label>\n<div class="compactTile compactToggle"><div><span class="tileLabel">Khôi phục sau mất điện</span>',
              '<label class="compactTile"><span>Độ ẩm đặt</span><div class="unit"><input id="targetHumidity" max="90" min="30" type="number" value="58"/><b>%RH</b></div></label>\n<div class="compactTile compactToggle"><div><span class="tileLabel">Tạo ẩm tự động</span><small>Dùng relay GPIO48 khi RH thấp hơn mức đặt.</small></div><label aria-label="Bật tạo ẩm tự động" class="toggle"><input id="humidifierEnabled" type="checkbox"/><i></i></label></div>\n<div class="compactTile compactToggle"><div><span class="tileLabel">Khôi phục sau mất điện</span>',
              'web batch humidity controls')
          write(path, s)

          path = 'app.js'
          s = read(path)
          s = replace_once(s,
              "    'emergencyTemp', 'kp', 'ki', 'kd', 'lowHumidityAlarm', 'ventOnTemp',",
              "    'emergencyTemp', 'kp', 'ki', 'kd', 'lowHumidityAlarm', 'humidifierEnabled',\n    'targetHumidity', 'ventOnTemp',",
              'web config keys humidity')
          s = replace_once(s,
              "    check('batchForm', 'resumeAfterPowerLoss', config.autoResumeAfterPower);\n    if (!hasDirtyForm('batchForm') || force) {\n      $('batchName').value = device.batchMeta.name;\n      $('startDate').value = device.batchMeta.startDate;\n      $('targetHumidity').value = device.batchMeta.targetHumidity;\n    }",
              "    check('batchForm', 'resumeAfterPowerLoss', config.autoResumeAfterPower);\n    check('batchForm', 'humidifierEnabled', config.humidifierEnabled);\n    assign('batchForm', 'targetHumidity', config.targetHumidity);\n    if (!hasDirtyForm('batchForm') || force) {\n      $('batchName').value = device.batchMeta.name;\n      $('startDate').value = device.batchMeta.startDate;\n    }",
              'web apply humidity config')
          s = replace_once(s,
              "      config.totalIncubationDays = Number($('totalDays').value);\n      config.autoResumeAfterPower = $('resumeAfterPowerLoss').checked;",
              "      config.totalIncubationDays = Number($('totalDays').value);\n      config.targetHumidity = Number($('targetHumidity').value);\n      config.humidifierEnabled = $('humidifierEnabled').checked;\n      config.autoResumeAfterPower = $('resumeAfterPowerLoss').checked;",
              'web build humidity config')
          s = replace_once(s,
              "    if (!(humidity >= 20 && humidity <= 95)) return invalidate('batchForm', 'targetHumidity', 'Độ ẩm tham khảo phải từ 20 đến 95%RH.');",
              "    if (!(humidity >= 30 && humidity <= 90)) return invalidate('batchForm', 'targetHumidity', 'Độ ẩm đặt phải từ 30 đến 90%RH.');",
              'web humidity validation')
          s = replace_once(s,
              "      updateOutput('outputVent', false);\n      updateOutput('outputTurn', false, 'ĐANG ĐẢO', 'CHỜ');",
              "      updateOutput('outputVent', false);\n      updateOutput('outputHumidifier', false);\n      updateOutput('outputTurn', false, 'ĐANG ĐẢO', 'CHỜ');",
              'web offline humidifier state')
          s = replace_once(s,
              "    updateOutput('outputVent', bool(runtime.ventFanOn));\n    updateOutput('outputLight', bool(runtime.lightOn));",
              "    updateOutput('outputVent', bool(runtime.ventFanOn));\n    updateOutput('outputHumidifier', bool(runtime.humidifierOn));\n    updateOutput('outputLight', bool(runtime.lightOn));",
              'web live humidifier state')
          write(path, s)

          # ------------------------------------------------------------------
          # Release sync + targeted regression tripwires
          # ------------------------------------------------------------------
          path = 'sw.js'
          s = replace_once(read(path), "const CACHE = 'mayap-web-v11.7.3';",
                           "const CACHE = 'mayap-web-v11.7.4';", 'web cache version')
          write(path, s)

          path = 'release-manifest.json'
          manifest = json.loads(read(path))
          manifest['release'] = '3.8.2'
          manifest['firmware'] = '3.8.2'
          manifest['web'] = '11.7.4'
          write(path, json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          path = 'doc/attiny_power_alarm.md'
          s = replace_once(read(path),
              '**Den, coi va relay spare khong arm bao mat dien.**',
              '**Den, coi va tao am khong arm rieng bao mat dien; tao am chi chay trong me nen batch arm da bao phu.**',
              'ATtiny doc humidity wording')
          write(path, s)

          path = 'tools/check_v381_reliability.py'
          s = read(path)
          s = replace_once(s,
              "require_re(config, r'MAYAP_FIRMWARE_VERSION\\[\\]\\s*=\\s*\"3\\.8\\.1\"', \"firmware version\")",
              "require_re(config, r'MAYAP_FIRMWARE_VERSION\\[\\]\\s*=\\s*\"3\\.8\\.2\"', \"firmware version\")",
              'reliability version gate')
          s = replace_once(s,
              'require(attiny_doc, "Den, coi va relay spare khong arm bao mat dien", "light excluded while heatMaster remains an arm source")',
              'require(attiny_doc, "Den, coi va tao am khong arm rieng bao mat dien", "humidifier covered by batch arm")',
              'ATtiny doc regression gate')
          s = replace_once(s,
              'print("v3.8.1 reliability regression checks: OK")',
              'require(config, "PIN_OUT_HUMIDIFIER", "single-relay humidifier GPIO")\nrequire(config, "humidifierEnabled = false", "humidifier optional default off")\nrequire(machine, "config_.humidifierEnabled && batchRunning_", "humidifier batch permit")\nrequire(machine, "HUMIDIFIER_HYSTERESIS_RH", "humidifier hysteresis")\nrequire(app, "\'humidifierEnabled\',", "web humidifier config field")\nrequire(app, "outputHumidifier", "web humidifier runtime tile")\n\nprint("v3.8.2 reliability regression checks: OK")',
              'humidity regression tripwires')
          write(path, s)
          PY

      - name: Validate static contracts
        run: |
          node --check app.js
          node --check config.js
          python3 tools/check_release_sync.py
          python3 tools/check_v381_reliability.py
          git diff --check

      - name: Commit focused feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kiều Việt'
          git config user.email '120502812+Kqviet1810@users.noreply.github.com'
          git add MAYAP_INDUSTRIAL_v3_4_0/config.h \
                  MAYAP_INDUSTRIAL_v3_4_0/machine_control.h \
                  MAYAP_INDUSTRIAL_v3_4_0/hmi.h \
                  MAYAP_INDUSTRIAL_v3_4_0/realtime_link.h \
                  index.html app.js sw.js release-manifest.json \
                  doc/attiny_power_alarm.md tools/check_v381_reliability.py
          git commit -m 'feat: add optional single-relay humidity control'
          git push origin HEAD:hardening/v3.8.2-humidity
