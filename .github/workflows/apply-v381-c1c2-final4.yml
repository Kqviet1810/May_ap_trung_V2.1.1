name: Apply v3.8.1 C1-C2 remediation final4

on:
  push:
    branches:
      - hardening/v3.8.1-reliability

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: hardening/v3.8.1-reliability
          fetch-depth: 2

      - name: Apply final guarded remediation
        run: python3 tools/apply_v381_c1c2_final.py

      - name: Validate permanent regression gates
        run: |
          node --check app.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/security-wrapper.js
          node --check cloudflare/src/reliability-wrapper.js
          python3 tools/check_release_sync.py
          python3 tools/check_v381_reliability.py
          git diff --check

      - name: Remove temporary patch machinery
        run: |
          rm -f tools/apply_v381_c1c2_fixes.py
          rm -f tools/apply_v381_c1c2_final.py
          rm -f .github/workflows/apply-v381-c1c2-once.yml
          rm -f .github/workflows/apply-v381-c1c2-retry.yml
          rm -f .github/workflows/apply-v381-c1c2-final.yml
          rm -f .github/workflows/apply-v381-c1c2-final2.yml
          rm -f .github/workflows/apply-v381-c1c2-final3.yml
          rm -f .github/workflows/apply-v381-c1c2-final4.yml

      - name: Commit verified remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::Remediation produced no changes"; exit 1; }
          git commit -m "fix(v3.8.1): complete C1-C2 safety and lifecycle remediation"
          git push origin HEAD:hardening/v3.8.1-reliability
